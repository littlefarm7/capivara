[package]
name = "capivara"
version = "0.1.0"
edition = "2024"
description = "Capivara — baixa vídeos, áudios e transcreve (YouTube, Shorts, TikTok, Reels, Stories e +1800 sites)"
license = "MIT"
default-run = "capivara"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
clap = { version = "4", features = ["derive", "env"] }
open = "5"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Whisper fica lento demais sem otimização — otimiza dependências mesmo em debug.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
